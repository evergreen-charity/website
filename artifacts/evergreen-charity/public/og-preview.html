<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600&family=DM+Sans:wght@300&display=swap');

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    width: 1200px;
    height: 630px;
    overflow: hidden;
    background: hsl(160, 15%, 5%);
    color: hsl(45, 20%, 85%);
    font-family: 'Space Grotesk', sans-serif;
    position: relative;
  }

  /* Grid */
  .grid {
    position: absolute;
    inset: 0;
    background-image:
      linear-gradient(hsl(152 40% 18% / 0.28) 0.5px, transparent 0.5px),
      linear-gradient(90deg, hsl(152 40% 18% / 0.28) 0.5px, transparent 0.5px);
    background-size: 64px 64px;
  }

  /* Center glow */
  .glow {
    position: absolute;
    inset: 0;
    background: radial-gradient(ellipse 60% 55% at 50% 44%, hsl(152 90% 50% / 0.09) 0%, transparent 70%);
  }

  /* Porch light beam */
  .beam {
    position: absolute;
    inset: 0;
    background: radial-gradient(ellipse 85% 75% at 95% 11%, hsl(152 90% 50% / 0.13) 0%, hsl(152 90% 50% / 0.06) 35%, transparent 68%);
  }

  /* Lantern */
  .lantern {
    position: absolute;
    top: 0;
    right: 0;
    width: 160px;
    height: 420px;
  }

  /* Main content */
  main {
    position: relative;
    z-index: 10;
    width: 100%;
    height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 0 48px;
  }

  .logo { color: hsl(158, 60%, 42%); margin-bottom: 20px; }

  h1 {
    font-family: 'Space Grotesk', sans-serif;
    font-weight: 600;
    font-size: 64px;
    line-height: 0.88;
    letter-spacing: 0.08em;
    text-transform: uppercase;
  }

  .green { color: hsl(158, 60%, 42%); }

  .rule {
    margin-top: 16px;
    width: 260px;
    height: 1px;
    background: hsl(158 60% 42% / 0.2);
  }

  p {
    margin-top: 14px;
    font-family: 'DM Sans', sans-serif;
    font-weight: 300;
    font-size: 20px;
    line-height: 1.65;
    letter-spacing: 0.01em;
    color: hsl(45 20% 85% / 0.6);
  }
</style>
</head>
<body>
  <div class="grid"></div>
  <div class="glow"></div>
  <div class="beam"></div>

  <!-- Porch light fixture -->
  <svg class="lantern" viewBox="0 0 160 420" fill="none" xmlns="http://www.w3.org/2000/svg">
    <!-- Wall bracket -->
    <rect x="130" y="14" width="30" height="6" fill="white" fill-opacity="0.35"/>
    <!-- Arm -->
    <line x1="130" y1="17" x2="78" y2="17" stroke="white" stroke-width="1.4" stroke-opacity="0.45" stroke-linecap="round"/>
    <!-- Vertical drop -->
    <line x1="78" y1="17" x2="78" y2="52" stroke="white" stroke-width="1.2" stroke-opacity="0.4" stroke-linecap="round"/>
    <!-- Lantern body -->
    <path d="M66,52 L90,52 L94,88 L62,88 Z" stroke="white" stroke-width="1.1" stroke-opacity="0.45" fill="hsl(152,90%,50%)" fill-opacity="0.07"/>
    <!-- Top cap -->
    <rect x="63" y="48" width="30" height="5" fill="white" fill-opacity="0.35"/>
    <!-- Bottom vent -->
    <line x1="64" y1="88" x2="92" y2="88" stroke="white" stroke-width="1" stroke-opacity="0.4"/>
    <!-- Bulb -->
    <circle cx="78" cy="70" r="5" fill="hsl(152,90%,50%)" fill-opacity="0.9"/>
    <circle cx="78" cy="70" r="9" fill="hsl(152,90%,50%)" fill-opacity="0.2"/>
    <!-- Drip chain -->
    <line x1="78" y1="88" x2="78" y2="112" stroke="hsl(152,90%,50%)" stroke-width="0.8" stroke-opacity="0.3" stroke-dasharray="2 3" stroke-linecap="round"/>
  </svg>

  <main>
    <!-- ForestMark -->
    <div class="logo">
      <svg width="120" height="120" viewBox="0 0 48 48" fill="none">
        <!-- back tree -->
        <polygon points="27,9 22,30 32,30" stroke="currentColor" stroke-opacity="0.25" stroke-width="0.9" stroke-linejoin="round" stroke-linecap="round" fill="none"/>
        <line x1="24.5" y1="32.5" x2="29.5" y2="32.5" stroke="currentColor" stroke-opacity="0.25" stroke-width="1.08" stroke-linecap="round"/>
        <!-- mid tree -->
        <polygon points="22,15 15,36 29,36" stroke="currentColor" stroke-opacity="0.6" stroke-width="1.1" stroke-linejoin="round" stroke-linecap="round" fill="none"/>
        <line x1="18.5" y1="38.5" x2="25.5" y2="38.5" stroke="currentColor" stroke-opacity="0.6" stroke-width="1.32" stroke-linecap="round"/>
        <!-- front tree -->
        <polygon points="17,21 7.5,42 26.5,42" stroke="currentColor" stroke-opacity="1" stroke-width="1.35" stroke-linejoin="round" stroke-linecap="round" fill="none"/>
        <line x1="12.25" y1="44.5" x2="21.75" y2="44.5" stroke="currentColor" stroke-opacity="1" stroke-width="1.62" stroke-linecap="round"/>
      </svg>
    </div>

    <h1>Evergreen <span class="green">Charity</span></h1>
    <div class="rule"></div>
    <p>
      Endow permanent funds for perpetual giving.<br>
      Grant now, or invest and grant over time.
    </p>
  </main>
</body>
</html>
